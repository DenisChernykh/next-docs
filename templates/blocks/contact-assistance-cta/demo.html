<section class="section section--flush section--curved-top section--curved-bottom contact-assistance-cta" id="contact-assistance-cta"
  aria-labelledby="contact-assistance-cta-title" data-header-surface="dark">
  <div class="container container--full-bleed">
    <div class="contact-assistance-cta__panel">
      <picture class="contact-assistance-cta__media">
        <img src="/blocks/contact-assistance-cta/assets/background.webp" alt="" loading="lazy">
      </picture>

      <div class="contact-assistance-cta__overlay" aria-hidden="true"></div>

      <div class="contact-assistance-cta__content">
        <div class="contact-assistance-cta__info">
          <div class="section-header section-header--column">
            <h2 class="section-title" id="contact-assistance-cta-title">
              Нужна помощь с&nbsp;выбором?
            </h2>

            <div class="section-text section-text--inverted">
              Расскажем о&nbsp;доступных вариантах, уточним детали и&nbsp;поможем подобрать решение под ваш запрос.
            </div>
          </div>

          <div class="contact-assistance-cta__contacts">
            <a class="contact-assistance-cta__phone" href="tel:+79999999999">
              +7 (999) 999-99-99
            </a>

            <div class="contact-assistance-cta__socials" aria-label="Социальные сети">
              <a class="social-link social-link--sm social-link--vk" href="https://vk.com/" target="_blank"
                rel="nofollow noindex" aria-label="ВКонтакте">
                <img src="/blocks/contact-assistance-cta/assets/icon-vk.svg" alt="" loading="lazy">
              </a>

              <a class="social-link social-link--sm social-link--max" href="https://max.ru/" target="_blank"
                rel="nofollow noindex" aria-label="MAX">
                <img src="/blocks/contact-assistance-cta/assets/icon-max.svg" alt="" loading="lazy">
              </a>
            </div>
          </div>
        </div>

        <div class="contact-assistance-cta__actions">
          <a class="button button--primary button--block" href="#catalog">
            Выбрать вариант
          </a>

          <button class="button button--glass-arrow button--block" type="button" data-modal-id="modalContact"
            data-modal-source="contact-assistance-cta">
            Получить консультацию
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
