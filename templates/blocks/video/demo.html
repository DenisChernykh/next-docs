<section
  class="section video"
  id="video"
  aria-labelledby="video-title"
  data-header-surface="light"
  data-video
>
  <div class="container">
    <div class="video__inner">
      <div class="section-header section-header--column">
        <h2 class="section-title" id="video-title">
          Детейлинг в&nbsp;деталях: как мы работаем
        </h2>
        <div class="section-text">
          Загляните за&nbsp;кулисы. Показываем наши стандарты, оборудование
          лаборатории и&nbsp;реальный процесс защиты премиальных автомобилей.
        </div>
      </div>

      <div class="video__media-wrap" data-lazyvideo-click>
        <video
          class="video__media"
          poster="/blocks/video/assets/poster.png"
          preload="metadata"
          playsinline
          data-lazyvideo="reset"
          data-lazyvideo-autoplay="false"
        >
          <source src="/blocks/video/assets/demo-video.webm" type="video/webm">
        </video>

        <div class="video__action">
          <button class="video-play-button" type="button" data-lazyvideo-button>
            <span class="video-play-button__text">Смотреть</span>
            <span class="video-play-button__icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
